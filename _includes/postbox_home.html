<!-- begin post -->
{% assign author = site.authors[post.author] %}


<div class="col-md-4" style="margin-bottom: 30px;">
    <!-- blog item -->
    <div class="blog-item rounded bg-white shadow-dark wow fadeIn" href="{{ site.baseurl }}{{ post.url }}">
        <div class="thumb">
            <a href="#">
                <span class="category">{{ post.categories[0] }}</span>
            </a>
            {% if post.image %}
            <a href="{{ site.baseurl }}{{ post.url }}">
                <img  style="height: 233.328px;" src="{% if post.image contains "://" %}{{ post.image }}{% else %}{{ site.baseurl }}/{{ post.image }}{% endif %}" alt="{{ post.title }}">
            </a>
            {% endif %}
        </div>
        <div class="details">
            <h4 class="my-0 title"><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h4>
            <ul class="list-inline meta mb-0 mt-2">
                <li class="list-inline-item">{{ post.date | date_to_string }}</li>
                <li class="list-inline-item">{{ author.display_name }}</li>
            </ul>
        </div>
    </div>
</div>
