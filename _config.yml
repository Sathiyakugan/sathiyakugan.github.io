#-------------------------------
# General Site Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://sathiyakugan.dev" # the base hostname & protocol for your site, e.g. http://example.com


#-------------------------------
# Build Settings
#markdown: kramdown

#kramdown:
#  syntax_highlighter: coderay
#  syntax_highlighter_opts:
#    line_numbers: false
#    default_lang: python

#kramdown:
#  syntax_highlighter: rouge
#  syntax_highlighter_opts:
#    block:
#      default_lang: python
#      line_numbers: false


permalink: /:title
plugins:
  - jekyll-paginate
  - jekyll-sitemap

paginate: 5
paginate_path: "/blog/page/:num"


#-------------------------------
# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug
  works:
    output: true
    permalink: /work/:slug

# Pages Path
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "works"
    values:
      layout: "work"

sass:
  sass_dir: _sass
  style: compressed